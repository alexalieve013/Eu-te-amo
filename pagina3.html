<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Página 2</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.fundo {
    height: 100vh;
    background-image: url("https://img.freepik.com/vetores-gratis/coracoes-fundo-azul-escuro_78370-2880.jpg?semt=ais_user_personalization&w=740&q=80");
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    opacity: 0;
    transition: 3s;
}

.box {
    position: relative;
    background: rgba(0,0,0,0.6);
    padding: 40px;
    border-radius: 20px;
    color: white;
    max-width: 800px;
    z-index: 2;
}

.texto {
    font-size: 24px;
    margin-bottom: 30px;
    min-height: 220px;
    white-space: pre-line;
}

.botao {
    padding: 15px 40px;
    background: #ff4d6d;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    display: none;
    animation: aparecer 1s forwards;
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

/* Corações */
.coracao {
    position: absolute;
    color: #ff4d6d;
    animation: subir 5s linear infinite;
}

@keyframes subir {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-800px); opacity: 0; }
}
</style>
</head>

<body>

<div class="fundo">
    <div class="overlay" id="overlay"></div>

    <div class="box">
        <div class="texto" id="texto"></div>
        <a href="pagina3.html" class="botao" id="botao">Continuar ❤️</a>
    </div>
</div>

<script>
const textoCompleto = `Benjamim, amo você Cabeça de nos todos, continue sempre sendo esse menino incrivel, bricalhão e sorridente
que você cresça e realize esse seu sonho de ser, policia, obrigado por me fazer uma pessoa felíz espero que um dia possa te encontrar de novo cabeça de nederite`;

const elementoTexto = document.getElementById("texto");
const botao = document.getElementById("botao");
const overlay = document.getElementById("overlay");

let i = 0;

// Função que escreve o texto letra por letra automaticamente
function escreverTexto() {
    if (i < textoCompleto.length) {
        elementoTexto.innerHTML += textoCompleto.charAt(i);
        i++;
        setTimeout(escreverTexto, 45);
    } else {
        overlay.style.opacity = "1";
        botao.style.display = "inline-block";
        criarCoracoes();
    }
}

// Função que cria corações subindo
function criarCoracoes() {
    setInterval(() => {
        const coracao = document.createElement("div");
        coracao.classList.add("coracao");
        coracao.innerHTML = "❤️";
        coracao.style.left = Math.random() * 100 + "vw";
        coracao.style.fontSize = (20 + Math.random() * 20) + "px";
        document.body.appendChild(coracao);

        setTimeout(() => {
            coracao.remove();
        }, 5000);
    }, 300);
}

// Inicia a escrita do texto automaticamente ao carregar a página
window.addEventListener("load", () => {
    escreverTexto();
});
</script>

</body>
</html>
