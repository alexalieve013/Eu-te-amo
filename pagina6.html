Perfeito! 😍 Vamos criar uma página com:

Fundo preto

Texto no topo “Momento Distração”

Uma galeria de fotos com efeito de hover suave (zoom/pulsar)

Frase final “OBRIGADO POR TUDO” centralizada embaixo

Aqui está o código completo e responsivo:

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momento Distração</title>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: black;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

h1 {
    font-size: 3rem;
    margin-top: 30px;
    animation: brilho 2s infinite;
}

/* Animação de brilho suave */
@keyframes brilho {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

/* Galeria de fotos */
.gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 40px 10px;
    gap: 15px;
}

.gallery img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 12px;
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
}

.gallery img:hover {
    transform: scale(1.1) rotate(2deg);
    box-shadow: 0 0 20px rgba(77,166,255,0.8);
}

/* Frase final */
.final-text {
    font-size: 2rem;
    margin: 50px 20px;
    color: #4da6ff;
    animation: pulsar 2s infinite;
}

@keyframes pulsar {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
</style>
</head>
<body>

<h1>Momento Distração</h1>

<div class="gallery">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/8.jpeg?raw=true" alt="Foto 8">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/7.jpeg?raw=true" alt="Foto 7">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/6.jpeg?raw=true" alt="Foto 6">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/5.jpeg?raw=true" alt="Foto 5">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/4.jpeg?raw=true" alt="Foto 4">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/3.jpeg?raw=true" alt="Foto 3">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/2.jpeg?raw=true" alt="Foto 2">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/12.jpg?raw=true" alt="Foto 12">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/11.jpg?raw=true" alt="Foto 11">
    <img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/10.jpg?raw=true" alt="Foto 10">
</div>

<div class="final-text">OBRIGADO POR TUDO</div>

</body>
</html>
