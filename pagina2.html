<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Página 2</title>

<style>
    body { 
        margin: 0; 
        font-family: Arial, sans-serif;
    }

    .fundo {
        height: 100vh;
        background-image: url("https://img.freepik.com/vetores-gratis/fundo-abstrato-do-bokeh-com-coracoes_1053-257.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .box {
        background: rgba(0,0,0,0.5);
        padding: 30px;
        border-radius: 15px;
        color: white;
        max-width: 800px;
    }

    .texto {
        font-size: 24px;
        margin-bottom: 30px;
        min-height: 200px;
    }

    .botao {
        padding: 12px 35px;
        background: #ff4d6d;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        display: none;
    }
</style>
</head>

<body>

<div class="fundo">
    <div class="box">
        <div class="texto" id="texto"></div>
        <a href="pagina3.html" class="botao" id="botao">Avançar</a>
    </div>
</div>

<audio id="musica">
    <source src="https://raw.githubusercontent.com/alexalieve013/Eu-te-amo/main/Luan%20Santana%20-%20Te%20esperando%20(Clipe%20Oficial)%20-%20Part.%20Giovanna%20Lancellotti%20-%20Luan%20Santana%20(youtube).mp3" type="audio/mpeg">
</audio>

<script>
    const textoCompleto = `Alexia, não sei o que fez você mudar assim de repente...
Queria ao menos poder entender o que aconteceu, mas já vi que você não quer papo.
Se eu te fiz qualquer coisa, peço desculpas, nunca seria minha intenção.
Você é uma mulher incrível e guerreira, eu te admiro muito e você sabe disso.
Você sabe que eu nunca irei desistir de você.
Como diria Luan Santana: "Eu vou estar te esperando, nem que já esteja velhinha gagá".`;

    const elementoTexto = document.getElementById("texto");
    const botao = document.getElementById("botao");
    const musica = document.getElementById("musica");

    let i = 0;

    function escreverTexto() {
        if (i < textoCompleto.length) {
            elementoTexto.innerHTML += textoCompleto.charAt(i);
            i++;
            setTimeout(escreverTexto, 40);
        } else {
            botao.style.display = "inline-block";
            musica.play();
        }
    }

    escreverTexto();
</script>

</body>
</html>
