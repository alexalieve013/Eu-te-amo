<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amor Infinito 💙</title>

<style>
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    font-family: Arial, sans-serif;
    color: #4da6ff;
    text-align: center;
}

h1 {
    font-size: 2.5rem;
    margin: 20px;
    animation: pulsar 2s infinite;
}

/* Animação suave */
@keyframes pulsar {
    0%, 100% { transform: scale(1); color: #4da6ff; }
    50% { transform: scale(1.1); color: #66b3ff; }
}

img {
    width: 80%;
    max-width: 400px;
    border-radius: 20px;
    margin-top: 30px;
    box-shadow: 0 0 25px rgba(77,166,255,0.7);
}

video {
    width: 80%;
    max-width: 600px;
    margin-top: 30px;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(77,166,255,0.7);
}

/* Botão FINAL */
button {
    padding: 18px 40px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #4da6ff;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(77,166,255,0.6);
    margin-top: 25px;
}

button:hover {
    background: #66b3ff;
    transform: scale(1.05);
}
</style>
</head>
<body>

<img src="https://github.com/alexalieve013/Eu-te-amo/blob/main/82c07ffa-30c2-4d85-8a2a-77abf98f0168.jpg?raw=true" alt="Amor Infinito">
